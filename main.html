<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nymphy — Nicheknights Clear Log</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="login-screen">
      <div id="login-box">
        <div class="logo">NYMPHY</div>
        <div class="sub">Admin Login — Nicheknights Clear Log</div>
        <label>Username</label>
        <input id="li-user" autocomplete="username" />
        <label>Password</label>
        <input id="li-pass" type="password" autocomplete="current-password" />
        <div id="login-error"></div>
        <button id="btn-login">Masuk</button>
        <button id="btn-regis">Registrasi</button>
      </div>
    </div>

    <div id="app" class="hidden">
      <header>
        <div class="left">
          <span class="logo">NYMPHY</span>
          <span class="sub">Nicheknights Clear Log</span>
        </div>
        <div>
          <span class="who" id="who"></span>
          <button class="ghost" id="btn-logout" style="margin-left: 8px">
            Logout
          </button>
        </div>
      </header>
      <main>
        <div class="grid">
          <div class="card">
            <h2>Input Data Clear</h2>
            <label>Stage</label>
            <input id="f-stage" placeholder="mis. Stage 12-B" />
            <label>Niche</label>
            <input id="f-niche" placeholder="mis. Fire Knights" />
            <label>Jumlah Operator</label>
            <input id="f-opcount" type="number" min="0" placeholder="mis. 4" />
            <label>Nama Operator</label>
            <textarea id="f-ops" placeholder="satu nama per baris"></textarea>
            <div class="hint">Pisahkan tiap operator dengan baris baru.</div>
            <label>Player</label>
            <textarea
              id="f-players"
              placeholder="satu nama per baris"
            ></textarea>
            <div class="hint">Pisahkan tiap player dengan baris baru.</div>
            <button id="btn-submit">Simpan Data</button>
          </div>

          <div class="card">
            <h2>Ringkasan</h2>
            <div class="total" id="stat-total">0</div>
            <div class="hint" style="margin-bottom: 10px">
              Total data clear tercatat
            </div>
            <div id="stat-niche"></div>
            <h2 style="margin-top: 16px">Per Stage</h2>
            <div id="stat-stage"></div>
          </div>
        </div>

        <div class="card" style="margin-top: 16px">
          <h2>Riwayat Data</h2>
          <div id="list"><div class="empty">Belum ada data.</div></div>
        </div>
      </main>
    </div>

    <!-- Firebase SDK (compat build, tinggal <script> tag, tanpa bundler) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/stats.js"></script>
    <script>
      /* ---------- INIT ---------- */
      (function init() {
        const u = currentUser();
        if (u) showApp(u);
      })();
    </script>
  </body>
</html>
